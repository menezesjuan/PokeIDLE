<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PokeIDLE - Herói Pokémon IDLE</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" />
</head>
<body>
  <div id="app">
    <!-- Top Floating Header Bar -->
    <div id="hud-top" class="hud-top-bar"></div>

    <!-- Battle Canvas Area (Central Highlight) -->
    <div id="phaser-container"></div>

    <!-- Live Event Ticker -->
    <div id="status-ticker" class="status-ticker">
      <span>[SISTEMA] Pronto para a aventura Pokémon. Caçando selvagens...</span>
      <span style="opacity: 0.6;">PokeIDLE v1.0 • Companheiro de Barra</span>
    </div>

    <!-- Pokemon GO Floating Bottom Hub -->
    <div id="hud-container" class="pokemongo-hud"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
